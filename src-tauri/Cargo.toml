[package]
name = "ros-chronotrace"
version = "1.3.0"
description = "Desktop time-tracking application with automated context capture"
authors = ["you"]
edition = "2021"
default-run = "slint-app"

[lib]
name = "digital_diary"
path = "src/lib.rs"

[[bin]]
name = "slint-app"
path = "src/slint_main.rs"

[[bin]]
name = "ros-chronotrace"
path = "src/main.rs"
required-features = ["legacy-tauri"]

[build-dependencies]
tauri-build = { version = "2.0", features = [], optional = true }
slint-build = "1"
specta = { version = "2.0.0-rc.22", features = ["derive", "function"] }
specta-typescript = "0.0.9"

[dependencies]
slint = "1"
tauri = { version = "2.0", features = [], optional = true }
tauri-plugin-shell = { version = "2.0", optional = true }
tauri-plugin-fs = { version = "2.0", optional = true }
tauri-plugin-dialog = { version = "2.0", optional = true }
tauri-plugin-updater = { version = "2.0", optional = true }
tauri-plugin-process = { version = "2.0", optional = true }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rusqlite = { version = "0.31", features = ["bundled"] }
tokio = { version = "1.0", features = ["full"] }
chrono = "0.4"
dirs = "5.0"
windows-capture = "1.5.0"
windows = { version = "0.58", features = ["Win32_UI_WindowsAndMessaging", "Win32_System_Threading", "Win32_Foundation"] }
once_cell = "1.19"
rdev = "0.5.3"
tempfile = "3.10"
specta = { version = "2.0.0-rc.22", features = ["derive", "function"] }
specta-typescript = "0.0.9"
tauri-specta = { version = "2.0.0-rc.20", features = ["typescript"], optional = true }
base64 = "0.22"
webp = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }

[dev-dependencies]
tempfile = "3.10"

[features]
default = []
legacy-tauri = [
    "dep:tauri",
    "dep:tauri-build",
    "dep:tauri-plugin-shell",
    "dep:tauri-plugin-fs",
    "dep:tauri-plugin-dialog",
    "dep:tauri-plugin-updater",
    "dep:tauri-plugin-process",
    "dep:tauri-specta",
]
custom-protocol = ["legacy-tauri", "tauri/custom-protocol"]
